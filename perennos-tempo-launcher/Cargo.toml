[package]
name = "perennos-tempo-launcher"
version = "2.0.1"
edition = "2021"
authors = ["Perennos"]
description = "tempo-launch: opens a Perennos Tempo app from a shortcut. Starts its server hidden if it is not running, then opens it in the browser. No console window, ever."

[lib]
name = "tempo_launch"
path = "src/lib.rs"

[[bin]]
name = "tempo-launch"
path = "src/main.rs"

# std first. Two crates, both for the fleet messenger: SQLite (bundled, so nothing is installed
# beside Tempo) holds the durable outbox and inbox; getrandom is the operating system's random
# source for the fleet key.
[dependencies]
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
getrandom = "0.2"
# pairing with a short code (SPAKE2 over Ed25519), the key it makes protects what is sent (ChaCha20-Poly1305),
# and each computer's identity signs its frames (Ed25519): RustCrypto, no more.
spake2 = "0.4"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"

# Elliptic-curve maths is unusably slow unoptimized (milliseconds a signature): keep it fast in
# test and debug builds too, so the messenger's numbers there mean something.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 2

[profile.release]
opt-level = "s"
strip = true
lto = true

# Standalone: own Cargo.lock, never part of a parent workspace.
[workspace]
