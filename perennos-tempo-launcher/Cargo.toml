[package]
name = "perennos-tempo-launcher"
version = "2.0.1"
edition = "2021"
authors = ["Perennos"]
description = "tempo-launch: opens a Perennos Tempo app from a shortcut. Starts its server hidden if it is not running, then opens it in the browser. No console window, ever."

[lib]
name = "tempo_launch"
path = "src/lib.rs"

[[bin]]
name = "tempo-launch"
path = "src/main.rs"

# std first. Two crates, both for the fleet messenger: SQLite (bundled, so nothing is installed
# beside Tempo) holds the durable outbox and inbox; getrandom is the operating system's random
# source for the fleet key.
[dependencies]
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
strip = true
lto = true

# Standalone: own Cargo.lock, never part of a parent workspace.
[workspace]
