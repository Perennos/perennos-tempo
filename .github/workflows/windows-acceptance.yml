name: Fresh Windows installer acceptance
on:
  push:
    branches: ['release/v1-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record fresh Windows Server baseline
        run: python -I -B acceptance/windows_acceptance.py baseline
      - name: Prepare closed manifest payload
        run: python -I -B acceptance/prepare_payload.py --dest C:/TempoCI/payload --result C:/TempoCI-out/payload.json
      - name: Seal bundled Python on disposable build VM only
        timeout-minutes: 15
        run: python -I -B acceptance/build_python_runtime.py
      - name: Build native unsigned setup
        run: C:/TempoCI/build-python/python.exe -I -B build_desktop_installer.py --package C:/TempoCI/payload --out C:/TempoCI/build --python-runtime C:/TempoCI/python-runtime.zip
      - name: Verify and extract without claiming installation
        run: C:/TempoCI/build-python/python.exe -I -B acceptance/windows_acceptance.py verify-build
      - name: Install through own native UI and exercise actual local runtime
        timeout-minutes: 36
        run: C:/TempoCI/build-python/python.exe -I -B acceptance/windows_acceptance.py run
      - name: Stage bounded public synthetic evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path C:/TempoCI/build-python/python.exe) {
            & C:/TempoCI/build-python/python.exe -I -B acceptance/windows_acceptance.py stage
          } else {
            & "$env:pythonLocation/python.exe" -I -B acceptance/windows_acceptance.py stage
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-acceptance
          path: C:/TempoCI-out/upload/
          retention-days: 1
          if-no-files-found: error
