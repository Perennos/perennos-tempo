[package]
name = "perennos-tempo-local-agent"
version = "2.0.0"
edition = "2021"
authors = ["Perennos"]
description = "Perennos Tempo local agent: offline agent loop over Ollama with MCP, RAG, guarded file tools and a persistent workflow file."

[lib]
name = "tempo_local_agent"
path = "src/lib.rs"

[[bin]]
name = "tempo-local-agent"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.145"
regex = "=1.12.2"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

# Standalone: own Cargo.lock, never part of a parent workspace.
[workspace]
